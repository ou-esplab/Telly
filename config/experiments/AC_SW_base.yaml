# Stationary-wave teaching experiment (baseline).
#
# Three forcings of stationary Rossby waves are switched on one at a time on a
# zonally symmetric baseline (see EXPERIMENTS.md, "Stationary-wave experiments"):
#   mountains          topography: real | flat
#   land-sea contrast  basic_state: landsea_contrast | zonal_mean
#   diabatic heating   shape/scale: shapeAC/scaleAC (observed) | ZonalMean
#
#   AC_SW_base     flat   zonal_mean        zonal heating   (no zonal asymmetry)
#   AC_SW_mtn      REAL   zonal_mean        zonal heating   + mountains
#   AC_SW_landsea  flat   LANDSEA_CONTRAST  zonal heating   + land-sea contrast
#   AC_SW_heat     flat   zonal_mean        OBSERVED heating + heating
#   AC_SW_all      REAL   LANDSEA_CONTRAST  OBSERVED heating  all three on
#
# A forcing's stationary-wave response is its run minus AC_SW_base. All
# relaxation targets are zonally symmetric except the land-masked temperature
# asymmetry in the landsea runs, so waves must be generated by the forcing.
# Preprocess directory: <preprocess_path_override>_<basic_state>[_realtopo] (suffix added
# automatically; build with scripts/01_preprocess.py --config <this file>).
# 5-year first stage (see run_length_days); a 60-day stability test passed for all five.
model_type: gamma_ac
topography: flat
basic_state: zonal_mean
heating_name: ZonalMean
shape_file_override: shape_ZonalMean.pt
scale_file_override: scale_ZonalMean.pt
experiment_name: AC_SW_base
start_year: 1994
end_year: 2024
season: annual
preprocess_path_override: /data/esplab/kpegion/projects/AGCM/AnnualCycle
preprocess_root: /data/esplab/kpegion/projects/AGCM/AnnualCycle
experiment_root: /data/esplab/kpegion/projects/AGCM_Experiments
run_length_days: 1830   # first stage: 61 x 30-day chunks (~5 yr); extend toward 7290 (20 yr) later with cold_start: false, toffset: 1830
cold_start: true
toffset: 0
control_experiment: AC_SW_base
spinup_days: 60
plot_vars: [uvel, vvel, geo]
postprocess_vars: [uvel, vvel, geo, temp]
zw: 63
kmax: 26
chunk_size_days: 30
compute_slp: false
diagnostic_heating_source: cmap_default
plot_levels_hpa: [200, 500, 850]
