# Gamma_AC warm experiment — 2160 days (6 years) complete
#
# The completed run used shapeAC_Warm.pt/scaleAC_Warm.pt (gamma-distribution
# parameters fit to composited El Nino precipitation, see
# Gamma_AC_Model/reference_notebooks/preprocess.Gamma_heating.ipynb), set by
# manually editing Gamma_AC_Model/reference_notebooks/RunModel.Gamma.ipynb —
# confirmed from that notebook's own stored execution output. Extending or
# restarting this experiment now correctly uses the same files via
# shape_file_override/scale_file_override below (RunModel.Gamma.py gained a
# --shapefile/--scalefile option so this is no longer manual-edit-only).
model_type: gamma_ac
# start_year/end_year: informational only -- this shared preprocess
# directory's background-state climatology actually uses two different
# periods (surface pressure & winds: 1994-2024; temperature: unsliced,
# ~1948-2025) -- see AC_Test.yaml's comment / EXPERIMENTS.md's Gamma_AC
# section for the full explanation. Set to 1994/2024 as the best single
# approximation (accurate for 2 of 3 fields).
start_year: 1994
end_year: 2024
season: annual
heating_name: warm

preprocess_path_override: /data/esplab/kpegion/projects/AGCM/AnnualCycle
experiment_name: AC_warm   # exact output directory name under experiment_root (no formula applied)
preprocess_root: /data/esplab/kpegion/projects/AGCM/AnnualCycle
shape_file_override: shapeAC_Warm.pt
scale_file_override: scaleAC_Warm.pt

run_length_days: 2160
cold_start: false
toffset: 2160

control_experiment: null
spinup_days: 60
plot_vars: [vvel, uvel, geo]
plot_levels_hpa:
- 200
- 500
- 850
