# Gamma_AC warm experiment — 2160 days (6 years) complete
model_type: gamma_ac
zw: 63
kmax: 26
start_year: 1979
end_year: 2023
season: annual
heating_name: warm
heating_source: custom

preprocess_path_override: /data/esplab/kpegion/projects/AGCM/AnnualCycle
experiment_root: /data/esplab/kpegion/projects/AGCM_Experiments
preprocess_root: /data/esplab/kpegion/projects/AGCM/AnnualCycle
input_data_path: /data/esplab/kpegion/projects/AGCM/MultiThread_Model/input_data

# Experiment output directory is AC_warm (Gamma script prefixes "AC_")
# The directory name produced by 02_run_model.py will be T63L26_annual_warm_1979-2023
# but the actual data is in AC_warm.  Use the override below if re-running via script.
# experiment_name_override: AC_warm  # (not yet supported — run Gamma script directly)

run_length_days: 2160
chunk_size_days: 30
cold_start: false
toffset: 2160

postprocess_vars: [uvel, vvel, geo]
pressure_levels_hpa: [850, 500, 300, 200]
compute_slp: false

control_experiment: null
spinup_days: 60
plot_levels_hpa: [200, 850]
plot_vars: [vvel, uvel, geo]
