# Gamma_AC no-heating experiment.
#
# Status: initial 1825-day (5-yr) run completed 2026-08-12. Extended
# 2026-08-18 to the same 7290-day (20-yr) target as AC_ElNino/AC_LaNina/
# AC_Trend/AC_MJO* -- the wxregimes ERA5-regime-matching analysis found the
# 5-yr composite had the weakest (though still real, non-spurious) ERA5
# correlation of any experiment, consistent with EXPERIMENTS.md's documented
# finding that short Gamma_AC runs are a noisy climatological sample; this
# extension tests whether more data closes that gap.
#
# IMPORTANT: before this fix, running this config through
# scripts/02_run_model.py would have silently used the control gamma
# parameters (shapeAC.pt/scaleAC.pt) instead of the no-heating ones —
# run_gamma_ac() always calls RunModel.Gamma.py, never the separate
# RunModel.Gamma-noheating.py script that has the right files hardcoded.
# shape_file_override/scale_file_override below fix that: RunModel.Gamma.py
# now takes --shapefile/--scalefile, so this config alone is sufficient —
# RunModel.Gamma-noheating.py is no longer needed for a pipeline-driven run.
model_type: gamma_ac
# start_year/end_year: informational only -- this shared preprocess
# directory's background-state climatology actually uses two different
# periods (surface pressure & winds: 1994-2024; temperature: unsliced,
# ~1948-2025) -- see AC_Test.yaml's comment / EXPERIMENTS.md's Gamma_AC
# section for the full explanation. Set to 1994/2024 as the best single
# approximation (accurate for 2 of 3 fields).
start_year: 1994
end_year: 2024
season: annual
heating_name: noheating

preprocess_path_override: /data/esplab/kpegion/projects/AGCM/AnnualCycle
experiment_name: AC_noheating   # exact output directory name under experiment_root (no formula applied)
preprocess_root: /data/esplab/kpegion/projects/AGCM/AnnualCycle
shape_file_override: shape_noheating.pt
scale_file_override: scale_noheating.pt

run_length_days: 7290
cold_start: false
toffset: 1825

control_experiment: AC_Test
spinup_days: 60
plot_vars: [vvel, uvel, geo]
plot_levels_hpa:
- 200
- 500
- 850
