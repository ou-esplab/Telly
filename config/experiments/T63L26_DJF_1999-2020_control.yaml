# DJF control run (no anomalous heating) — 720 days complete
model_type: multithreaded
model_subtype: beta
zw: 63
kmax: 26
start_year: 1999
end_year: 2020
season: DJF
heating_name: control
heating_source: custom

# Existing files use the v2 preprocess directory and old heating file naming
preprocess_path_override: /data/esplab/kpegion/projects/AGCM/MultiThread_Model/preprocess__zw_63__kmax_26_v2_DJF_1999-2020
heating_file_override: heat_DJF_1999-2020.ggrid.pt
experiment_root: /data/esplab/kpegion/projects/AGCM_Experiments
preprocess_root: /data/esplab/kpegion/projects/AGCM/MultiThread_Model  # not used (override set)
input_data_path: /data/esplab/kpegion/projects/AGCM/MultiThread_Model/input_data

# Run status: 720 days complete; restart ready
run_length_days: 720
chunk_size_days: 30
steps_per_day: 324
cold_start: false
toffset: 720   # 720 days already run

postprocess_vars: [uvel, vvel, geo]
pressure_levels_hpa: [850, 500, 300, 200]
compute_slp: false

control_experiment: null   # this IS the control
spinup_days: 100
plot_levels_hpa: [200, 850]
plot_vars: [vvel, uvel]
