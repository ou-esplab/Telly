# ============================================================
# Shared defaults for all experiment configs
# ============================================================
# Every key here is identical across all 21 current experiment configs.
# Values here are merged in first; anything an experiment config sets
# explicitly always overrides these (see scripts/_config.py:load_config).
#
# Deliberately NOT included here, even though they're constant across the
# 18 fixed_season configs: model_subtype, steps_per_day. Those don't apply
# to gamma_ac configs at all (gamma_ac ignores model_subtype and derives
# steps_per_day internally from zw), so keeping them explicit per
# fixed_season config avoids implying they mean something for gamma_ac too.
# ============================================================

# --- Resolution ---
zw: 63
kmax: 26

# --- Paths ---
experiment_root: /data/esplab/kpegion/projects/AGCM_Experiments
input_data_path: /data/esplab/kpegion/projects/AGCM/MultiThread_Model/input_data

# --- Surface boundary conditions (gamma_ac only) ---
# Two independent switches (see EXPERIMENTS.md, "Stationary-wave experiments"):
#   topography : real | flat        PHIS the model reads (flat = sea level, PHIS = 0)
#   basic_state: observed           observed NCEP climatology (relaxation targets already
#                                   contain the observed stationary waves)
#                observed_sealevel  observed asymmetries, ln(ps)/surface T at sea level
#                zonal_mean         zonally symmetric (sea-level) state, no land
#                landsea_contrast   zonal_mean + land-masked observed T asymmetry in the
#                                   temperature relaxation target only
# Non-observed basic states use a separate "<preprocess dir>_<basic_state>" directory, with
# a "_realtopo" suffix when topography is real (surface pressure and sigma-level fields
# must sit on the terrain; see EXPERIMENTS.md).
# Legacy preset surface_mode sets both: realistic = (real, observed),
# flat_topography = (flat, observed_sealevel), aquaplanet = (flat, zonal_mean);
# explicit topography/basic_state keys override it.
surface_mode: realistic

# --- Topography and land-sea mask (gamma_ac; local files, always used) ---
# topography_file: gridded surface geopotential PHIS (m^2/s^2), variable "topog".
# land_sea_mask_file: ERA5 land-sea mask (variable "lsm"), used for the land mask and to
# zero the small ocean ripples in the (spectrally smoothed) topography file.
# (The JISAO elevation server this used to download from no longer exists.)
topography_file: /data/esplab/shared/geographic/topo/topog.gridded0.5.nc
land_sea_mask_file: /data/esplab/shared/reanalysis/era5/land_sea_mask.nc

# --- Heating ---
heating_source: custom

# --- Model run ---
chunk_size_days: 30

# --- Post-processing (step 3) ---
postprocess_vars: [uvel, vvel, geo]
pressure_levels_hpa: [850, 500, 300, 200]
compute_slp: false

# --- Plotting (step 4) ---
plot_levels_hpa: [200, 850]
