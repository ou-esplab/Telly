# ============================================================
# Smoke test config — gamma_ac model
# ============================================================
# NOT a real experiment. Used by scripts/smoke_test.sh to run a cheap,
# fast end-to-end check of steps 1-3 of the pipeline (preprocess/run/
# postprocess) against the existing AnnualCycle preprocess directory.
# Output goes to /tmp/atm_smoke_test, never to the real experiment_root,
# and is safe to delete at any time.
#
# This exercises exactly the code path that used to have hardcoded
# paths/resolution in RunModel.Gamma.py (fixed — now driven by this
# config via scripts/02_run_model.py's --datapath/--prepath/--zw/--kmax/--tl).
# ============================================================

model_type: gamma_ac
start_year: 1979
end_year: 2023
season: annual
heating_name: Test

preprocess_path_override: /data/esplab/kpegion/projects/AGCM/AnnualCycle
preprocess_root: /data/esplab/kpegion/projects/AGCM/AnnualCycle

experiment_root: /tmp/atm_smoke_test
experiment_name: smoke_test_gamma_ac

run_length_days: 3
chunk_size_days: 3
cold_start: true
toffset: 0

control_experiment: null
spinup_days: 0
plot_vars: [vvel, uvel, geo]
