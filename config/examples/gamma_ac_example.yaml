# ============================================================
# ATM Workflow Config — Gamma Annual Cycle Model Example
# ============================================================
# Run the full pipeline with:
#   python scripts/01_preprocess.py  --config config/experiments/this_file.yaml
#   python scripts/02_run_model.py   --config config/experiments/this_file.yaml
#   python scripts/03_postprocess.py --config config/experiments/this_file.yaml
#   python scripts/04_plot_results.py --config config/experiments/this_file.yaml
# ============================================================

# --- Model variant ---
model_type: gamma_ac    # "fixed_season" | "gamma_ac"
# model_subtype is not used for gamma_ac

# --- Resolution ---
zw: 63
kmax: 26

# --- Climatology period ---
start_year: 1979
end_year: 2023
season: annual    # Must be "annual" for gamma_ac (uses daily-varying annual cycle climatology)

# --- Heating ---
# For gamma_ac, heating is generated dynamically from gamma distribution parameters
# (shape/scale .pt files), so heating_source describes what obs dataset to fit the
# distribution to. heating_name labels the saved parameter files.
heating_name: warm           # Label for this forcing scenario (e.g., warm, cold, neutral)
heating_source: cesm2        # cca | cesm2 | era5 | custom

# --- Paths ---
input_data_path: /data/esplab/kpegion/projects/AGCM/MultiThread_Model/input_data
preprocess_root: /data/esplab/kpegion/projects/AGCM/AnnualCycle
experiment_root: /data/esplab/kpegion/projects/AGCM_Experiments
# Exact output directory name under experiment_root — used verbatim, no formula is
# applied. Gamma_AC experiments conventionally use an "AC_" prefix (e.g. AC_Test,
# AC_warm) rather than the generic T{zw}L{kmax}_{season}_... pattern used elsewhere.
experiment_name: AC_warm

# --- Model run ---
run_length_days: 2160   # 6 years; longer runs appropriate for annual cycle model
chunk_size_days: 30
cold_start: true
toffset: 0

# --- Post-processing (step 3) ---
postprocess_vars: [uvel, vvel, geo]
pressure_levels_hpa: [850, 500, 300, 200]
compute_slp: false

# --- Plotting (step 4) ---
control_experiment: null    # Set to experiment name string, or null to skip diff maps
spinup_days: 60
plot_levels_hpa: [200, 850]
plot_vars: [vvel, uvel, geo]
