# ============================================================
# Smoke test config — fixed_season model
# ============================================================
# NOT a real experiment. Used by scripts/smoke_test.sh to run a cheap,
# fast end-to-end check of steps 1-3 of the pipeline (preprocess/run/
# postprocess) against an existing preprocess directory. Output goes to
# /tmp/atm_smoke_test, never to the real experiment_root, and is safe to
# delete at any time.
# ============================================================

model_type: fixed_season
model_subtype: weakly_prescribed_mean
start_year: 1979
end_year: 2023
season: JJA
heating_name: JJA_1979-2023

# Reuses the real, already-generated JJA preprocess directory — this smoke
# test does not regenerate preprocessing, just exercises steps 1 (no-op
# check since files already exist), 2, and 3.
preprocess_path_override: /data/esplab/kpegion/projects/AGCM/MultiThread_Model/preprocess__zw_63__kmax_26
heating_file_override: heat.ggrid_JJA_1979-2023.pt
preprocess_root: /data/esplab/kpegion/projects/AGCM/MultiThread_Model

experiment_root: /tmp/atm_smoke_test
experiment_name: smoke_test_fixed_season

run_length_days: 2
chunk_size_days: 2
steps_per_day: 324
cold_start: true
toffset: 0

control_experiment: null
spinup_days: 0
plot_vars: [vvel, uvel, geo]
