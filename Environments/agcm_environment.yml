# Primary environment spec for the ATM pipeline.
#
# Covers all 4 steps (scripts/01_preprocess.py through 04_plot_results.py),
# verified against a currently-working install. Step 4 uses plain
# matplotlib + cartopy (no proplot — proplot is unmaintained and fails to
# install on Python >=3.12; see git history if you need the old
# proplot-based plotting code).
#
# Also covers tools/ (jupyterlab + ipywidgets — the notebook there needs
# both to render).
#
# Pins below are for packages where version actually matters (either
# because a newer major version breaks the code, e.g. numpy 2.x, or
# because the package's API changes fast, e.g. torch-harmonics). Everything
# else is left unpinned and will resolve to current compatible versions.
name: agcm_environment
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy<2
  - pandas
  - scipy
  - xarray
  - pyyaml
  - xesmf
  - netcdf4
  - metpy
  - dask
  - matplotlib
  - cartopy
  - pydap
  - pytorch=2.4.*
  - ipykernel
  - jupyterlab
  - ipywidgets
  - pip:
      - torch-harmonics==0.6.3
